# Deploys the React frontend to Azure Static Web Apps whenever main changes.
# VITE_API_URL is baked into the bundle at build time, so it is set here rather
# than in Azure. Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN
# (Static Web App -> Overview -> Manage deployment token).
name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Build the frontend
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: https://tenniscomp-dkdxhgawdsbnfwgw.newzealandnorth-01.azurewebsites.net

      # The app is already built above, so Azure only uploads frontend/dist.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
