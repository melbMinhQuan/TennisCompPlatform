# Deploys the NestJS backend to Azure App Service whenever main changes.
# npm workspaces keep every dependency in the root node_modules, so the backend
# cannot be uploaded on its own folder. This builds it, then packages dist/,
# prisma/ and package.json with their own production node_modules.
# Needs the repository secret AZURE_BACKEND_PUBLISH_PROFILE (App Service ->
# Overview -> Download publish profile).
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Build the backend
        run: npm run build --workspace=backend

      # prisma (the CLI) is installed as a runtime dependency here because the
      # App Service startup command runs `prisma migrate deploy` before the API
      # starts, so a release that adds a migration applies it automatically.
      - name: Package the backend on its own
        run: |
          mkdir deploy
          cp -r backend/dist backend/prisma backend/package.json deploy/
          cd deploy
          npm install --omit=dev
          npm install prisma@5.22.0
          npx prisma generate

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: tenniscomp
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: deploy
