# Uploads the backend package that CI built and tested (the backend-package job in ci.yml)
# to Azure App Service, then checks the live API works. Only CI calls this, once every check
# has passed on main; to redeploy, open that CI run and choose "Re-run all jobs".
# Needs the repository secret AZURE_BACKEND_PUBLISH_PROFILE (App Service ->
# Overview -> Download publish profile).
name: Deploy backend

on:
  workflow_call:

env:
  BACKEND_URL: https://tenniscomp-dkdxhgawdsbnfwgw.newzealandnorth-01.azurewebsites.net
  FRONTEND_URL: https://delightful-pond-03c981700.5.azurestaticapps.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Only for the check script: the backend itself is the package CI tested.
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the tested package
        uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Unpack it
        run: |
          mkdir deploy
          tar -xzf backend-package.tgz -C deploy

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: tenniscomp
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: deploy

      # Fails if the live API cannot reach the database or refuses the live frontend (CORS).
      - name: Check the live backend
        run: node .github/scripts/smoke-test.mjs backend
